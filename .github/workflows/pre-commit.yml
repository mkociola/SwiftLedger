name: ✨ Lint & Format

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    # pre-commit builds SwiftLint from source with whatever `swift` is on the
    # PATH, so whoever supplies that compiler decides whether the pinned
    # revision builds. Swift 6.4, which ubuntu-24.04 ships from image
    # 20261004, refuses SwiftLint 0.63.0 (`Baseline.swift` reads a
    # SourceKitten member without importing the module, an error under
    # MemberImportVisibility). The official image installs the 6.3 toolchain
    # the package builds with under /usr, which is also where SourceKitten
    # looks for the SourceKit library SwiftLint loads at run time, so the
    # hooks need no further setup.
    #
    # The hook environment is cached under a key that covers only
    # .pre-commit-config.yaml, so a SwiftLint built here is restored even
    # after this image changes. Bump the image together with a hook revision,
    # or clear the cache, so the hooks are rebuilt with the new compiler.
    container: swift:6.3.3-noble
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The job runs as root, but the runner creates the workspace as its own
      # user, and git refuses to read a repository someone else owns. The
      # checkout only trusts it for its own commands, while pre-commit runs
      # git too.
      - name: 🔓 Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: 🔍 Run pre-commit hooks
        uses: tox-dev/action-pre-commit-uv@v1
