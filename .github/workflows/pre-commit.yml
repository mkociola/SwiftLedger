name: ✨ Lint & Format

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # pre-commit builds SwiftLint from source with whatever `swift` is on the
      # PATH, so the runner image decides which compiler sees the pinned
      # revision. Swift 6.4, which ubuntu-24.04 ships from image 20261004,
      # refuses SwiftLint 0.63.0 (`Baseline.swift` reads a SourceKitten member
      # without importing the module, an error under MemberImportVisibility),
      # and the hook environment is only cached once a build succeeds. Pinning
      # the toolchain the package already builds with keeps the hook versions
      # independent of the image.
      #
      # On Linux, setup-swift verifies the Swiftly download against the Swift
      # signing keys but never imports them, so a fresh runner has no key to
      # check the signature with. Importing swift.org's keyring first keeps
      # the verification instead of skipping it. The file is served gzipped,
      # and `zcat -f` passes it through unchanged should that ever stop.
      - name: 🔑 Import the Swift signing keys
        shell: bash
        run: curl -fsSL https://swift.org/keys/all-keys.asc | zcat -f | gpg --import

      - name: 🛠️ Setup Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.3"

      - name: 🔍 Run pre-commit hooks
        uses: tox-dev/action-pre-commit-uv@v1
