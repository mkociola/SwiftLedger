name: 🚀 Build & Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: macos-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 🛠️ Setup Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.3"

      - name: 📦 Resolve Swift dependencies
        run: swift package resolve

      - name: 🛠️ Build
        run: swift build

      - name: 🧪 Test
        run: swift test --parallel

  hledger-fixtures:
    name: hledger fixtures are current
    runs-on: macos-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 📦 Install hledger
        run: brew install hledger jq

      - name: 🔁 Regenerate fixtures
        run: Scripts/hledger-fixtures.sh

      # The fixtures are the contract, not the patch release that wrote them:
      # Homebrew on the runner may lag or lead the hledger that produced the
      # committed files, and a different version that reads every journal the
      # same way is not a failure. The version is printed so that a real diff
      # below can be traced to it.
      - name: 🔍 Compare with the committed fixtures
        run: |
          echo "committed with: $(git show HEAD:Tests/SwiftLedgerTests/Conformance/hledger-version.txt)"
          echo "regenerated with: $(cat Tests/SwiftLedgerTests/Conformance/hledger-version.txt)"
          git diff --exit-code -- Tests/SwiftLedgerTests/Conformance ':!Tests/SwiftLedgerTests/Conformance/hledger-version.txt'
