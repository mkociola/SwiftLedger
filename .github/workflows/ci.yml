name: 🚀 Build & Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: macos-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 🛠️ Setup Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.3"

      - name: 📦 Resolve Swift dependencies
        run: swift package resolve

      - name: 🛠️ Build
        run: swift build

      - name: 🧪 Test
        run: swift test --parallel

  hledger-fixtures:
    name: hledger fixtures are current
    runs-on: macos-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 📦 Install hledger
        run: brew install hledger jq

      - name: 🔁 Regenerate fixtures
        run: Scripts/hledger-fixtures.sh

      - name: 🔍 Compare with the committed fixtures
        run: git diff --exit-code -- Tests/SwiftLedgerTests/Conformance
